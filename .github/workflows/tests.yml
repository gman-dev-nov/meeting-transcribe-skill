name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    # Python 3.9 доступен в setup-python для 24.04, но не для нового 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 — системный python3 на macOS из Command Line Tools: скилл обязан
        # запускаться им без venv. Верхняя граница — актуальный релиз.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
